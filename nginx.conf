# Forge Agora's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and test/routes.test.ts reads this file and fails the build when they
# drift. "Remember to update nginx.conf" is not a mechanism; a test is.
#
# ── THERE IS NO proxy_pass IN THIS FILE, AND HERE IT IS THE ORDINARY REASON ────────────────────
#
# `micro-agora` exists and this bundle calls it on every page — unlike the exchange, which has no
# service at all. The API is reached at `api.<apex>/agora/v1`, routed there by the estate gateway,
# because that is where every other service in the estate is reached and because the gateway is
# what holds the CORS grant that lets this origin read the OTHER network's API (`viewsAnyNetwork`
# on this surface's registry row). Proxying `/v1` through this container would give the bundle a
# same-origin path that works on one network and silently fails on the other, which is the exact
# defect the combined view was built to remove.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/seo.test.ts reads that export and fails
# if this alternation has drifted from it. They are the words that name an environment rather than a
# surface: `surfaces.ts` reserves them so no surface may take one as a subdomain.
#
# `(?:[^.]+-)?` catches BOTH shapes, for the same reason `splitEnvLabel()` in @cloudsforge/ui
# resolves both: the environment is a suffix on the first label now (`agora-testnet.<apex>`) and
# was an apex prefix before (`testnet.<apex>`). The suffix shape exists because Cloudflare's
# Universal SSL wildcard matches exactly ONE label, so `agora.testnet.<apex>` has no certificate.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80. This is a fact about the IMAGE only. The registry's devPort
    # for `agora` is 4150, which is micro-agora's port and not this container's; the vite dev server
    # is 5197 and nothing in this file ever sees either.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. `/p/<id>` is the
    # link somebody pastes into a conversation and somebody else opens cold, which on this surface
    # is not an edge case — it is the main way anybody arrives.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # DENY rather than SAMEORIGIN, and this surface is the one that earns the stricter value. Every
    # other public frontend in the estate is a reference page that another CloudsForge site has a
    # reason to embed. This one carries authenticated write controls — a composer, a Spark button, a
    # Follow button — on pages a stranger's link can open, which is the shape clickjacking needs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its own
    # terms and must NOT fall through to the app shell: a JavaScript request answered with HTML
    # fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location that
        # declares ANY add_header inherits NONE from its parent. So every location below that sets
        # Cache-Control must restate the security headers, or it silently serves without them —
        # which is exactly what `location /assets/` did in the web template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale copy
    # pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` ships with no Cache-Control at all, which is
        # the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # One block for all of them. The alternation is split on `|` by test/routes.test.ts and every
    # member cross-checked against NON_INDEX_SEGMENTS, in both directions — a route added to the
    # router and forgotten here answers the fallback below, which is a 404 for an address the app
    # has, and a segment left here after a route is deleted is a 200 for an address it does not.
    #
    # `(/|$)` is the prefix form and is used for the childless ones too, because it is exact enough:
    # `/settings` matches and `/settingsx` does not.
    #
    # `moderation` IS IN THIS LIST, and it is the one entry that looks like a mistake. Serving the
    # shell at an address only an operator may use is not a leak: the page renders, every request it
    # makes is refused by micro-agora's `requireOperator`, and the reader sees a 403 panel. Leaving
    # it out would instead answer 404 for an address the app HAS, which breaks the bookmark of the
    # one person who works the queue — and a queue nobody can bookmark is a queue worked through
    # three screens every time. `robots.txt` does not need to disallow it: nothing links to it.
    location ~ ^/(home|p|v|tag|circles|notifications|whispers|bookmarks|search|settings|guidelines|moderation)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from two production estates
    # (test/no-build-time-config.test.ts). nginx is the component that knows: it has `$host` on every
    # request, so the addresses are composed per request and the artefact stays environment-free.
    #
    # This is NOT `sitemapXml()` from @cloudsforge/ui, because THIS SURFACE IS NOT THE APEX. The
    # shared generator composes every sibling as `<subdomain>.$host`, which is right on the marketing
    # site where `$host` IS the apex. Here `$host` is already `agora.<apex>`, so the same generator
    # would emit `network.agora.<apex>` — a two-label hostname that resolves to nothing and fails the
    # edge's one-label wildcard certificate.
    #
    # ── THREE ENTRIES, AND THE ABSENCES ARE THE DECISION ─────────────────────────────────────────
    #
    # `/p/<id>`, `/v/<handle>` and `/tag/<tag>` are all public and all indexable, and NONE of them is
    # listed. A sitemap is the one document a crawler treats as this site's own account of what it
    # publishes, and every one of those addresses is somebody's words or somebody's name. A person
    # who deletes a post has deleted it; an entry in a file that says "we publish this, come back for
    # it" outlives the delete. They are reachable, linked, and crawlable when a crawler finds them by
    # following a link — which is the difference between being findable and being advertised.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of the
        # two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/circles</loc></url>
  <url><loc>$scheme://$host/guidelines</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        # The six Disallowed paths are the reader's OWN pages. Every one of them needs a token and
        # answers 401 without one, so a crawler gains nothing by fetching them — but a `/whispers`
        # in a search index is a URL that reads like a public page of private messages, and that
        # impression is worth spending six lines to avoid. `/search` is disallowed for the ordinary
        # reason: the query space is infinite and every crawl of it is a full-text scan.
        return 200 'User-agent: *
Allow: /
Disallow: /home
Disallow: /notifications
Disallow: /whispers
Disallow: /bookmarks
Disallow: /settings
Disallow: /search

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (a favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so it
    # says the server is up — never that the product works. A green probe here is compatible with
    # micro-agora being unreachable and every timeline on the surface being a fault state.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
